experiment: capacity_and_algebra
seeds: [11, 22, 33]
algebras: [real_hrr, unitary_hrr, generalized_hrr, map]
dimensions: [256, 512, 1024, 2048, 4096]
bundle_sizes: [4, 16, 64, 256, 1024]
path_depths: [1, 2, 4, 8]
correlations: [0.0, 0.1, 0.3]
noise_std: [0.0, 0.05, 0.1, 0.2]
dtypes: [float32, bfloat16]
sharding: [flat, by_type, by_community, by_time]
cleanup: [nearest_atomic, learned, exact_fallback]
primary_metric: filler_mrr
constraints:
  target_one_hop_accuracy: 0.95
  max_abstention_calibration_error: 0.05
artifacts: [atomic_store, capacity_model, benchmark_report]
