# T7 — new biomedical vocabulary (author decision 55): the E9 natural-text track whose vocabulary is new to the host.
# Ontology: MeSH 2026 supplementary concept records (drugs and other chemicals, diseases, organisms) whose names occur
# ≥ 5 times in the training-side PubMed text and never in 300,000 documents of the C3 general (FineWeb-Edu) training
# stream — per record, over all its names (`ontologies/mesh_novel.py`). Frames: mapped heading, pharmacological action,
# record class, tree branches of the mapped headings; fillers are descriptors the hosts know well.
# Corpus: PubMed abstracts published 2025–26 (the 2026 baseline's 20 newest files + the 80 newest 2026 update files,
# PMIDs ≥ the baseline slice's first) that mention a selected name, mixed 50/50 by tokens with FineWeb-Edu (the C3
# stream). Built by the T1-open builder with the `mesh_novel` adapter; SmolLM2 tokenizer (E9 hosts).
#   1. PYTHONPATH=src python -m vsa_embed.experiments.t1_open_corpus --config experiments/t7-new-vocabulary/t7.yaml --stage fetch
#   2. PYTHONPATH=src python -m vsa_embed.experiments.t1_open_corpus --config experiments/t7-new-vocabulary/t7.yaml --stage screen \
#        --output experiments/t7-new-vocabulary/screen          # then pin ontology.selection_sha256 (frozen before linking)
#   3. PYTHONPATH=src python -m vsa_embed.experiments.t1_open_corpus --config experiments/t7-new-vocabulary/t7.yaml \
#        --output experiments/t7-new-vocabulary/runs/v1          # then pin data.expected_holdout_sha256
experiment: t7-new-vocabulary
track_label: new-vocabulary biomedical (MeSH SCR + PubMed 2025-26)
seed: 20261007
tokenizer: HuggingFaceTB/SmolLM2-360M
workers: 6
paths:
  data_root: ~/data/vsa-llm/tracks/t7-newvocab/v1
  pubmed_raw: ~/data/vsa-llm/pubmed/baseline-2026
  pubmed_text: ~/data/vsa-llm/pubmed/text-2026
  pubmedqa: ~/data/vsa-llm/pubmedqa
  general_config: experiments/c3-general-corpus/c3.yaml
pubmed:
  prefix: pubmed26n
  files: [1334, 1315]            # the T1 baseline slice (2025-26 publications, newest PMIDs)
  min_abstract_words: 30
  english_only: true
  eval_buckets: 2000             # PMIDs whose sha256 bucket is < 2,000 / 10,000 form the evaluation-only pool (20%)
  min_pmid: 41025505             # the baseline slice's first PMID: revised records of older citations in the update files are skipped
  updates:                       # the 80 newest 2026 update files (2026-06 to 2026-10), read before the baseline files
    files: [1651, 1572]
    base_url: https://ftp.ncbi.nlm.nih.gov/pubmed/updatefiles/
    raw: ~/data/vsa-llm/pubmed/updates-2026
    text: ~/data/vsa-llm/pubmed/text-updates-2026
pubmedqa:                        # MIT licence; its PMIDs never enter training (as T1)
  repo: qiaojin/PubMedQA
  file: pqa_labeled/train-00000-of-00001.parquet
  revision: 9001f2853fb87cab8d220904e0de81ac6973b318
  test_ground_truth_url: https://raw.githubusercontent.com/pubmedqa/pubmedqa/1cbae8e92f72f20c8d3747cbb3bf5bc53554d997/data/test_ground_truth.json
ontology:
  adapter: mesh_novel
  path: ~/data/vsa-llm/mesh/desc2026.gz
  supplementary_path: ~/data/vsa-llm/mesh/supp-2026/supp2026.gz
  selection: experiments/t7-new-vocabulary/screen/selection.tsv
  selection_sha256: null         # pinned after the screen stage, before the build
  max_atomics: 8192
  max_degree: 16
  policy:
    include_descriptors: false   # descriptors are mostly established words (novelty screen: 2.2 nats per span)
    scr_classes: ["1", "3", "4"] # chemicals and drugs, diseases, organisms
    min_domain_mentions: 5       # per record, over all its names, training-side PubMed
    max_general_mentions: 0      # per record, over all its names, the general sample below
screen:
  general_docs: 300000           # documents of the C3 general training stream (after its evaluation documents)
  workers: 6
mix:
  domain_share: 0.5
  calibration_docs: 2000
data:
  domain_filter: mentions        # only abstracts that mention a selected name (training and evaluation sides)
  presample_tokens: 10000000
  holdout_fraction: 0.20
  holdout_min_count: 5
  holdout_min_subtokens: 2
  holdout_max_containing: 5
  expected_holdout_sha256: null  # pinned after the first full build, before any training
  min_subtokens: 2
  train_tokens: 130000000        # an upper bound: the mixer stops when the mention-bearing PubMed stream ends
  reference_train_tokens: null
  train_min_subtokens: 1
  l1_slice_tokens: 0
  eval_pubmed_docs: null
  eval_general_docs: 5000
  eval_mix_tokens: null
  cardinality_docs: 2000
hosts: []                        # Qwen3 / Qwen3.5 relinks: add hosts entries (same documents, tables and holdout)
cardinality_tokenizers: [HuggingFaceTB/SmolLM2-360M]
feasibility:
  split: eval-pubmed
  heldout_min_entries_5plus: 300
  heldout_min_occurrences: 2000
  rare_min_entries: 300
  rare_min_occurrences: 2000
  trainer_windows: 2048
  window_length: 1024
