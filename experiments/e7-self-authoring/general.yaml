# E7 general track (WP-E7): reading corpora and hidden gold (D7.0), merged over e7_authoring.DEFAULTS.
#   PYTHONPATH=src python -m vsa_embed.experiments.e7_authoring prepare --track general \
#       --config experiments/e7-self-authoring/general.yaml --run experiments/e7-self-authoring/runs/general-v1
# Documents follow C3's shard order (002, then 000). general + replay come from the SmolLM2 host-corpus
# documents (from C3's eval_docs on); read (D_read) and test start right after the GPT-2 C3 training corpus
# (document 1,070,634 = 5,000 eval + 1,065,634 train), so they are disjoint from every C3 / host training corpus.
c3_run: experiments/c3-general-corpus/runs/v2
host_root: ~/data/vsa-llm/c3/wordnet-smollm2-v1
data_root: ~/data/vsa-llm/e7/general-v1
seed: 20261002
mask:
  fraction: 0.2          # of the WordNet entries linked (ℓ ≥ 2) in the SmolLM2 host training corpus, C3 holdout excluded
  min_count: 1
corpora:
  general_tokens: 60000000   # round-0 channel training (50M tokens sampled)
  replay_tokens: 6250000     # general text replayed in round 1 (20% of the round-1 mix)
  read_tokens: 25000000      # D_read
  test_tokens: 4000000       # held-out contexts (round-1 evaluation)
  min_subtokens: 2
  workers: 4
discovery:
  min_count: 8
  max_words: 3
  max_occurrences: 32
  keep: 5000
  batch: 8
authoring:
  candidates: 1000
  contexts: 4
  samples: 3
  temperature: 0.5
  top_p: 0.95
  max_new_tokens: 48
  min_share: 0.3
  batch: 16
  max_validation: 24
  context_chars: 400
direct:
  documents: 1500
  passage_chars: 600
  max_new_tokens: 96
  batch: 16
teacher:
  model: claude-opus-5-5
  batch: 8
