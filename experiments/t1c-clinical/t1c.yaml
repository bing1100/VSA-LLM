# T1c: the licensed clinical track — "clinical (SNOMED CT + MIMIC-III)" (author decision 58, 2026-10-07).
# Ontology: SNOMED CT International 2022-05-31 (RF2 snapshot; active concepts of seven top-level hierarchies; frames from
# the active inferred relationships). Corpus: MIMIC-III 1.4 NOTEEVENTS (ISERROR rows dropped; split by patient) mixed
# 50/50 by tokens with the C3 FineWeb-Edu stream (C3's evaluation documents skipped in training and reused as
# `eval-general`, the locality corpus). Reference tokenizer = the SmolLM2 hosts' (no GPT-2 corpus); the Qwen3 relink is
# `t1c-qwen3.yaml` (same ontology, alias table and holdout).
#
# LICENCE / DUA: every path under `paths` except `general_config` holds licensed or credentialed data or tables derived
# from it (mode 700, never committed). Run folders under experiments/t1c-clinical/runs/ receive aggregates only.
#   PYTHONPATH=src python -m vsa_embed.experiments.t1c_corpus --config experiments/t1c-clinical/t1c.yaml --stage inventory --output experiments/t1c-clinical/runs/inventory-v1
#   PYTHONPATH=src python -m vsa_embed.experiments.t1c_corpus --config experiments/t1c-clinical/t1c.yaml --stage extract
#   PYTHONPATH=src python -m vsa_embed.experiments.t1c_corpus --config experiments/t1c-clinical/t1c.yaml --output experiments/t1c-clinical/runs/v2
#   PYTHONPATH=src python -m vsa_embed.experiments.t1c_corpus --config experiments/t1c-clinical/t1c.yaml --stage definitions --output experiments/t1c-clinical/runs/definitions-v2
experiment: t1c-clinical
track_label: clinical (SNOMED CT + MIMIC-III)
seed: 20261007
tokenizer: HuggingFaceTB/SmolLM2-360M      # SmolLM2-135M and -360M share it (identical vocabularies)
workers: 4
paths:
  licensed_root: /home/bhux/workplace/VSA-LLM/data            # the credentialed files (git-ignored)
  notes_dir: ~/data/vsa-llm/t1c/notes-mimic3-v1
  data_root: ~/data/vsa-llm/t1c/snomed-mimic3-smollm2-v2   # v1 (holdout fa738430…, fraction 0.10) is stale
  general_config: experiments/c3-general-corpus/c3.yaml
mimic:
  noteevents: /home/bhux/workplace/VSA-LLM/data/physionet.org/files/mimiciii/1.4/NOTEEVENTS.csv.gz
  eval_buckets: 1000           # patients whose SUBJECT_ID sha256 bucket is < 1,000 / 10,000 are evaluation-only (10%)
  shards: 32
  categories: null             # every note category
umls:
  meta_dir: /home/bhux/workplace/VSA-LLM/data/umls-2022AB-full/2022AB-full/2022ab-1-meta/2022AB/META   # definitions count only
ontology:
  adapter: snomed
  path: /home/bhux/workplace/VSA-LLM/data/SnomedCT_InternationalRF2_PRODUCTION_20220531T120000Z
  hierarchies: [clinical_finding, procedure, body_structure, substance, product, organism, observable_entity]
  max_atomics: 8192
  max_degree: 16
  min_relation_edges: 200
  aliases:
    drop_abbreviations: true     # bare all-caps acronyms: the linker lowercases text (decision 19)
    max_abbreviation_chars: 8
    min_chars: 3
    max_words: 8
mix:
  domain_share: 0.5
  calibration_docs: 2000
data:
  presample_tokens: 10000000
  holdout_fraction: 0.30          # T1c-1 (author, 2026-10-07): re-frozen at 0.30 before any run, so the held-out stratum
                                  # meets decision 17's bar on the whole eval-mimic split (v1 at 0.10: 153 entries >= 5)
  holdout_min_count: 5
  holdout_min_subtokens: 2
  holdout_max_containing: 5
  expected_holdout_sha256: 7369ec276b45465900cc3a9898381392f52fa99d47821a4c6ad80df5eae8cec5   # re-frozen 2026-10-07 at fraction 0.30 from the same pre-sample (T1c-1), before any run; supersedes fa738430… (fraction 0.10, runs/v1, stale); a build that differs fails
  min_subtokens: 2
  train_tokens: 130000000
  train_min_subtokens: 1          # spans of every length stored
  eval_domain_docs: 40000         # first 40,000 evaluation-patient notes (shuffled order)
  eval_general_docs: 5000         # the C3 evaluation documents
  eval_mix_tokens: 10000000
  cardinality_docs: 2000
hosts: []
cardinality_tokenizers: [HuggingFaceTB/SmolLM2-135M, Qwen/Qwen3-0.6B-Base]
feasibility:
  min_occurrences: 2000          # decision 17 (WP-T1's power argument)
  min_entries: 300
  exploratory_occurrences: 1000  # WP-C7's lower bar
  exploratory_entries: 50
  trainer_windows: 2048          # decision 12
  window_length: 1024
