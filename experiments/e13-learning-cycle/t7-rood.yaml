# E13 learning cycle on T7-ROOD (the main real-text track; methodology §4, holdout H1; pre-registration amendment 1).
# The round split is TK-H1's `rounds-v1` build (`experiments/t7-new-vocabulary/ROOD.md` §5): T7's records split by MeSH
# DateIntroduced at 2013-01-26 into round 1 (5,714 entries) and round 2 (2,470); every training document naming a
# round-2 record is dropped from round 1 (audited: 0 leaks) and is round 2's training text (`train-round2`, 50/50 with
# general text). Read by `python -m vsa_embed.experiments.e13_cycle {prepare,items,learn,write,reason,report,plan} --config <this>`.
experiment: e13-learning-cycle
track: t7-rood
e9_track: t7                         # lexicon, relation choices, item spec and exclusion table
seed: 20261008
data_root: ~/data/vsa-llm/e13/t7-rood                  # <data_root>/<family>/ : seed ontology, defs stream, reference strata
rounds_root:
  smollm2: ~/data/vsa-llm/tracks/t7-newvocab/rounds-v1
  qwen3: ~/data/vsa-llm/tracks/t7-newvocab/rounds-v1/hosts/qwen3
alias_table: ~/data/vsa-llm/e13/t7-rood/alias-table-rounds.json   # T7's aliases with round 2 held out (rounds ontology digest)
families: {SmolLM2-360M: smollm2, Qwen3-1.7B-Base: qwen3}

seed_ontology:
  drop_round2_fillers: true          # round-1 frames lose their edges to round-2 terms
  derived_inverses: {}               # none: TK-L's proposer (primary) does not need them; erasure: learn.tkl.erase
  reference_family: smollm2          # the erasure's seen set (training frequency ≥ 10) for every family: one gold for both hosts

text:                                # general text of the `defs` stream's top-up (no T7 build read past document 300,000)
  general_shards: [~/data/vsa-llm/fineweb-edu/sample/10BT/002_00000.parquet]
  general_skip_docs: 300000

items:
  read_set: experiments/t7-new-vocabulary/runs/rounds-v1/round2-items-smollm2-v1     # 906 SCR notes (E11 format, style scr)
  understanding:                     # round-2 anchors (`e13_cycle items`): relation / reverse / paraphrase
    smollm2: experiments/e13-learning-cycle/items/understanding-t7rounds-smollm2-v1
    qwen3: experiments/e13-learning-cycle/items/understanding-t7rounds-qwen3-v1

stage0:
  configs:                           # the E9 T7 C5 recipe; data paths below replace T7's corpora by the rounds build's
    SmolLM2-360M: experiments/e9-retrofit/configs/t7/SmolLM2-360M-full-C5-s{seed}.yaml
    Qwen3-1.7B-Base: experiments/e9-retrofit/configs/t7-qwen3/Qwen3-1.7B-Base-lora-C5-s{seed}.yaml
  data: {train: train, eval: eval-round2, eval_round1: eval-round1}       # relative to rounds_root
  eval_windows: {smollm2: 2359, qwen3: 2356}                              # every eval-round2 window (ROOD.md §5.1)
  references: {}                     # no C0′ / C2 on the round-1 corpus

hosts:
  SmolLM2-360M:
    seeds: [1, 2, 3]
    round2_arms: [read, noread, fvt, gold, defs, random]
    frozen_arms: {rtn: [q4-read, q4-noread, qlora, qlora-read], nf4: [q4-read, q4-noread, qlora]}
  Qwen3-1.7B-Base:
    seeds: [1]
    round2_arms: [read, noread, gold, random]
    amended_arms: [random]           # amendment 2: L1's wrong-frame control on this host too (queued at the `amended` level)
    frozen_arms: {rtn: [q4-read, q4-noread, qlora]}

measure:
  SmolLM2-360M: experiments/e9-retrofit/runs/t5/SmolLM2-360M-full-C5-s1
  Qwen3-1.7B-Base: experiments/e9-retrofit/runs/t5-qwen3/Qwen3-1.7B-Base-lora-C5-s1

learn:
  primary: tkl                       # TK-L's learn tool (decompose + closure, `holm+decoy`) through E10.L's run_erasure
  secondary: [rule_closure]          # E13's registered proposer (T5's primary), on the same store
  proposer: rule_closure             # the rule-closure path's proposer
  rules: {min_support: 10, min_confidence: 0.6, kinds: [inverse_of, symmetric, transitive, composition_of]}
  validation: {corpus: eval-round1, per_entry: 8, length: 128, min_windows: 3, seed: 0}
  alpha: 0.05
  null_seed: 0
  precision_threshold: 0.8
  tkl:                               # E10.L's pre-registered T7 arm (`e10-learn/configs/erased-t7.yaml`), passive = features
    seed: 0                          # erasure / probe / null seed: the seed ontology's erasure uses it too (prepare)
    num_threads: 4
    erase: {fraction: 0.2, min_distinct_fillers: 10, keep: 1, probe_cap: 2000, min_frequency: 10, min_degree: 2,
            probe_requires_evidence: true}
    passive: {kind: features}
    evidence: {kind: occurrences, max_observations: 16, layer: middle}
    decoder: {folds: 5}
    sources: [decompose, closure]
    decompose: {method: omp, max_new: 2, threshold: 0.1, min_relative: 0.0}
    test: {alpha: 0.05, correction: holm+decoy, control: head, controls: 8, min_observations: 4, decoy_statistic: utility,
           variants: [holm]}
    nulls: [relabel, swap, permute]  # + the complete null (always; it supplies the decoys)
    pool: {distractors: 2}
    baselines: [prior]
    precision_target: 0.8
    extract: {splits: "eval_round1,train:20000", window: 512, max_per_entry: 32, batch: 16}   # stage-0 host hidden states

write: {reader: linker, secondary_readers: [linker-joint, typeprior], style: scr}

reason:
  conditions: none,recall:own,symbolic,definition   # amendment 2: + definition (amendment 1 had none: E12 has no T7 writer)
  definition_source: read_set        # the read set's SCR notes (the reader's input); anchors without one: not scored under it
  max_anchors: 600                   # a seeded sample of the round-2 anchors

round2:
  tokens: 10000000
  data_seed: 4321
  eval_points: [250000, 500000, 750000, 1000000, 1500000, 2000000, 3000000, 4000000, 5000000, 6000000, 8000000]
  seq_len: 1024
  general_windows: 256
  extra_evals: {eval_round1: eval-round1}   # forgetting on round-1 evaluation text, start and end
  use_learned: true
  lora_rank: 64
  lora_host_lr: 0.0002
  group_size: null
  calibration_windows: 64
  definition_context: true           # amendment 2: L1's definition comparator (`context` jobs: the noread arm's step-0 model)

statistics: {resamples: 2000, holm_alpha: 0.05, noninferiority_relative: 0.01, l4_precision: 0.8, l4_far: 0.05,
             l5_noninferiority_margin: 0.05}     # amendment 2: L5's cost criterion (δ, accuracy)

estimate_hours:                      # [scaled by host size, fixed] GPU hours of the evaluation-type jobs
  write: [0.45, 0.0]
  reason: [0.4, 0.0]

priority:                            # 54.4996 stage 0 (+ preparation, learn, write), 54.49965 stage 4, 54.4997 stage 5,
  base: 54.4996                      # 54.49975 reason, 54.49979 report (54.4998–54.49984: T1c-ROOD; 54.4995–54.49959: E10.L)
  step: 0.00005
  slots: {stage0: 0, stage4: 1, stage5: 2, evaluations: 3, report: 3.8,
          amended: 1.4, context: 3.4}  # amendment 2: 54.49967 (Qwen3 random), 54.49977 (context): free levels
