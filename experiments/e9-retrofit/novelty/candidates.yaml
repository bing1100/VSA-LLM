# Decision 55 candidate tracks: metadata of each P0 slice in runs/ (proxies measured there by `e9_novelty proxies`).
# entries / occurrences: for the built D8 tracks, the build's feasibility counts at ℓ_min 2 on 1,024 domain evaluation
# windows (held-out; rare); for the MeSH candidates, records and name occurrences in the PubMed 2025-26 baseline slice
# (20 files, 486,765 abstracts, all PMIDs; screening counter, not the linker).
#
# MeSH slices: `policy` (mesh_novel.NovelVocabularyPolicy keys) and the screening counts
# ~/data/vsa-llm/e9/novelty/counts-pubmed-baseline-slice.json (sha256 2aa287f1…; every MeSH 2026 term of ≥ 4 characters,
# whole-token matches as `mesh_novel.MentionCounter`, in all 486,765 abstracts) and counts-fineweb-300k.json (83c886e6…; the
# first 150,000 documents of FineWeb-Edu shards 000 and 002) rebuild each slice:
#   python -m vsa_embed.experiments.e9_novelty mesh-slice --policy '<policy as JSON>' \
#     --domain-counts ~/data/vsa-llm/e9/novelty/counts-pubmed-baseline-slice.json \
#     --general-counts ~/data/vsa-llm/e9/novelty/counts-fineweb-300k.json --output ~/data/vsa-llm/e9/novelty/<slice>
# then `p0-config --data-root <slice> --windows 512`, `training.lm`, `proxies --general <slice>/eval-general`. The T7 build
# re-counts on its own streams (training-side PubMed incl. the update files; the C3 general stream): screen/screen.json.
T2 developer tools (built):
  run: t2-SmolLM2-360M-P0
  source: generated private libraries + real API docs (90% / 10%)
  licence: generated; PSF-2.0 / MIT docs
  entries: 611 held-out, 1,203 rare
  occurrences: 2,147 held-out, 3,224 rare
  verdict: "excluded: templated synthetic text (decision 28); its novelty is the generated identifiers"
T3 product (built):
  run: t3-SmolLM2-360M-P0
  source: Google/Shopify taxonomy + Amazon ESCI titles
  licence: MIT / Apache-2.0
  entries: 148 held-out, 38 rare
  occurrences: 1,401 held-out, 64 rare
  verdict: "low novelty (T1-like); rare stratum infeasible; needs a 50/50 relink"
T6 legal (built):
  run: t6-SmolLM2-360M-P0
  source: EuroVoc 4.24 + MultiEURLEX (EUR-Lex)
  licence: EU reuse policy / CC BY-SA 4.0
  entries: 120 held-out, 65 rare
  occurrences: 5,122 held-out, 114 rare
  verdict: "low novelty (T1-like); rare stratum infeasible; needs a 50/50 relink"
MeSH descriptors introduced 2024-26:
  run: mesh-desc2024-SmolLM2-360M-P0
  slice: ~/data/vsa-llm/e9/novelty/desc2024
  policy: '{"scr_classes": [], "descriptor_min_year": 2024, "min_domain_mentions": 5, "max_general_mentions": 1000000000}'
  source: MeSH 2026 desc + PubMed 2025-26
  licence: NLM terms (free; attribution)
  entries: 465
  occurrences: ≈ 110,000
  verdict: "low novelty: new headings for established words"
MeSH SCRs introduced 2022-26:
  run: mesh-scr2022-SmolLM2-360M-P0
  slice: ~/data/vsa-llm/e9/novelty/scr2022
