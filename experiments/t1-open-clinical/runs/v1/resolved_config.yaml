ontology:
  adapter: mesh
  path: ~/data/vsa-llm/mesh/desc2026.gz
  max_atomics: 8192
  max_degree: 16
  aliases:
    exclude_classes:
    - '2'
    drop_lexical_tags:
    - ABB
    - ACR
    drop_resolved_inverted: true
mix:
  domain_share: 0.5
  calibration_docs: 2000
data:
  presample_tokens: 10000000
  holdout_fraction: 0.1
  holdout_min_count: 5
  holdout_min_subtokens: 2
  holdout_max_containing: 5
  expected_holdout_sha256: 1c477afda9822b260596c046fcdd3ca7205d9a5c0e22b44892d0cc1870ddcd88
  min_subtokens: 2
  train_tokens: 300000000
  train_min_subtokens: 1
  l1_slice_tokens: 0
  eval_pubmed_docs: null
  eval_general_docs: 5000
  eval_mix_tokens: null
  cardinality_docs: 2000
hosts:
- name: smollm2
  tokenizer: HuggingFaceTB/SmolLM2-360M
  train_tokens: 130000000
cardinality_tokenizers:
- gpt2
- HuggingFaceTB/SmolLM2-135M
- Qwen/Qwen2.5-0.5B
feasibility:
  split: eval-pubmed
  heldout_min_entries_5plus: 300
  heldout_min_occurrences: 2000
  rare_min_entries: 300
  rare_min_occurrences: 2000
  trainer_windows: 1024
  window_length: 1024
