# T1-open with the Qwen3 tokenizer (WP-Qwen): t1.yaml with one host relink, `hosts/qwen3` (Qwen3 base tokenizer, shared by
# Qwen3-0.6B/1.7B/4B-Base; uint32 ids, NFC decode check, fingerprint recorded). The holdout is chosen from the GPT-2
# reference presample as in t1.yaml (pinned hash), so it is the same; the reference corpora are reused (their
# `ontology.pt` is rewritten with the same content) and only `hosts/qwen3` is built (130M training tokens, as SmolLM2).
# Not run by WP-Qwen (several CPU-hours):
#   PYTHONPATH=src python -m vsa_embed.experiments.t1_open_corpus --config experiments/t1-open-clinical/t1-qwen3.yaml \
#     --output experiments/t1-open-clinical/runs/v1-qwen3
experiment: t1-open-clinical-qwen3
track_label: open-clinical (MeSH + PubMed)
seed: 20261002
tokenizer: gpt2
workers: 4
paths:
  data_root: ~/data/vsa-llm/t1/mesh-pubmed-gpt2-v1
  pubmed_raw: ~/data/vsa-llm/pubmed/baseline-2026
  pubmed_text: ~/data/vsa-llm/pubmed/text-2026
  pubmedqa: ~/data/vsa-llm/pubmedqa
  general_config: experiments/c3-general-corpus/c3.yaml
pubmed:
  prefix: pubmed26n
  files: [1334, 1315]          # newest first; 20 files, 486,765 usable abstracts (≈ 181M GPT-2 tokens)
  min_abstract_words: 30
  english_only: true
  eval_buckets: 800            # PMIDs whose sha256 bucket is < 800 / 10,000 form the evaluation-only pool (8%, ≈ 14M tokens)
pubmedqa:                      # MIT licence; its PMIDs never enter training
  repo: qiaojin/PubMedQA
  file: pqa_labeled/train-00000-of-00001.parquet
  revision: 9001f2853fb87cab8d220904e0de81ac6973b318
  test_ground_truth_url: https://raw.githubusercontent.com/pubmedqa/pubmedqa/1cbae8e92f72f20c8d3747cbb3bf5bc53554d997/data/test_ground_truth.json
ontology:
  adapter: mesh
  path: ~/data/vsa-llm/mesh/desc2026.gz
  max_atomics: 8192
  max_degree: 16
  aliases:
    exclude_classes: ["2"]          # publication types
    drop_lexical_tags: [ABB, ACR]   # bare abbreviations/acronyms (headings are kept)
    drop_resolved_inverted: true
mix:
  domain_share: 0.5
  calibration_docs: 2000
data:
  presample_tokens: 10000000
  holdout_fraction: 0.10
  holdout_min_count: 5
  holdout_min_subtokens: 2
  holdout_max_containing: 5
  expected_holdout_sha256: 1c477afda9822b260596c046fcdd3ca7205d9a5c0e22b44892d0cc1870ddcd88   # re-frozen 2026-10-02 from the full config before any training (the slice pin fd4244ea… came from a different mix calibration: the slice capped eval_general_docs, which feeds the chars-per-token calibration); a build that differs fails
  min_subtokens: 2
  train_tokens: 300000000
  train_min_subtokens: 1          # spans of every length stored: one corpus serves ℓ_min ∈ {1, 2, 3, 4}
  l1_slice_tokens: 0
  eval_pubmed_docs: null          # the whole evaluation pool (fewer: smaller eval corpus, same training stream and holdout)
  eval_general_docs: 5000         # the C3 evaluation documents
  eval_mix_tokens: null
  cardinality_docs: 2000
hosts:
  - name: qwen3                   # Qwen3-0.6B/1.7B/4B-Base share this tokenizer
    tokenizer: Qwen/Qwen3-0.6B-Base
    train_tokens: 130000000
cardinality_tokenizers: [gpt2, HuggingFaceTB/SmolLM2-135M, Qwen/Qwen3-0.6B-Base]
feasibility:
  split: eval-pubmed
  heldout_min_entries_5plus: 300
  heldout_min_occurrences: 2000
  rare_min_entries: 300
  rare_min_occurrences: 2000
  trainer_windows: 1024
  window_length: 1024
