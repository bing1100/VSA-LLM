# Protocol-2 re-run of 01c.3 (audit fixes A1-A5): capacity-fair rotated diagonal control,
# parameter-matched low-rank, identity-initialized HRR, derangement shuffles for every family.
# Development evidence only (same graph sample as the recorded run).
experiment: 01c3-controlled-basis-development-v2
protocol: 2
host:
  model: gpt2
  revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
  batch_size: 16
  max_length: 64
  anchor_truncation: gloss
data:
  relation_types: [hypernym, instance_hypernym, member_meronym, substance_meronym, part_meronym, antonym, attribute]
  max_edges_per_relation: 80
  min_edges_per_relation: 60
  selection_seed: 20260717
  test_fraction: 0.25
  validation_fraction: 0.0
  symmetric_relations: [antonym, attribute]
tracks: [contextual_centered]
split_modes: [node_disjoint]
methods:
  - offset
  - hrr
  - hrr_identity
  - basis_offset_residual_hrr
  - basis_offset_diagonal_control
  - basis_offset_rotated_diagonal_control
  - {family: low_rank_matched, match: basis_offset_residual_hrr}
  - shuffled_offset
  - shuffled_hrr
  - shuffled_basis_offset_residual_hrr
  - shuffled_basis_offset_diagonal_control
  - shuffled_basis_offset_rotated_diagonal_control
  - {family: shuffled_low_rank_matched, match: basis_offset_residual_hrr}
seeds: [13, 31, 53]
fit:
  rank: 8
  steps: 250
  learning_rate: 0.01
  cosine_weight: 1.0
  max_residual_scale: 0.15
  max_log_basis_scale: 0.20
  correction_weight: 0.05
  offset_weight: 0.01
  basis_weight: 0.05
  shuffle: derangement
evaluation:
  ties: mid
acceptance:
  primary_split: node_disjoint
  primary_track: contextual_centered
  candidate_methods: [basis_offset_residual_hrr]
  non_hrr_control: basis_offset_rotated_diagonal_control
  reconstruction_baseline: offset
  retrieval_baseline: hrr
  min_cosine_gain: 0.0
  min_mrr_delta: -0.02
  min_paired_wins: 2
  require_matched_shuffled: true
  promotion_eligible: false
device: cpu
num_threads: 1
